    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ================= VACINA DE RUNTIME / SHIELD UNIVERSAL ================= -->
    <script>
    (function() {
      'use strict';

      // 1. Favicon inline imediato (elimina o erro 404 clássico do console)
      if (!document.querySelector("link[rel*='icon']")) {
        var fav = document.createElement('link');
        fav.rel = 'icon';
        fav.href = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">✨</text></svg>';
        document.head.appendChild(fav);
      }

      // 2. Proteção contra bloqueio de LocalStorage em Iframes/Sandbox
      try {
        var testKey = '__shield_test__';
        window.localStorage.setItem(testKey, '1');
        window.localStorage.removeItem(testKey);
      } catch (e) {
        var memoryStore = {};
        Object.defineProperty(window, 'localStorage', {
          value: {
            getItem: function(k) { return memoryStore.hasOwnProperty(k) ? memoryStore[k] : null; },
            setItem: function(k, v) { memoryStore[k] = String(v); },
            removeItem: function(k) { delete memoryStore[k]; },
            clear: function() { memoryStore = {}; },
            key: function(i) { return Object.keys(memoryStore)[i] || null; },
            get length() { return Object.keys(memoryStore).length; }
          },
          writable: true,
          configurable: true
        });
      }

      // 3. Supressão de ruídos inofensivos de console (Extensões, ResizeObserver, Iframes)
      var noisePatterns = [
        'ResizeObserver loop',
        'ResizeObserver loop completed',
        'Extension context invalidated',
        'favicon.ico',
        'Non-passive event listener',
        'chrome-extension://'
      ];

      var origError = console.error;
      var origWarn = console.warn;

      console.error = function() {
        var msg = Array.prototype.join.call(arguments, ' ');
        for (var i = 0; i < noisePatterns.length; i++) {
          if (msg.indexOf(noisePatterns[i]) !== -1) return;
        }
        origError.apply(console, arguments);
      };

      console.warn = function() {
        var msg = Array.prototype.join.call(arguments, ' ');
        for (var i = 0; i < noisePatterns.length; i++) {
          if (msg.indexOf(noisePatterns[i]) !== -1) return;
        }
        origWarn.apply(console, arguments);
      };

      // 4. Captura defensiva de erros globais e Promises rejeitadas
      window.addEventListener('error', function(event) {
        if (!event.filename || event.filename.indexOf('chrome-extension') !== -1) {
          event.preventDefault();
          return;
        }
      });

      window.addEventListener('unhandledrejection', function(event) {
        event.preventDefault(); // Impede log vermelho de requisições canceladas ou bloqueadas
      });
    })();
    </script>
    <!-- ================= FIM DA VACINA ================= -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Italiana&display=swap" rel="stylesheet" />

      }
    </style>
